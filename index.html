<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Smart Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 SpendWise</h1>
            <p>Your Smart Budget Companion</p>
        </header>
        <main>
            <section class="card input-card">
                <h2>Budget Setup</h2>
                <button id="startBtn">Start Budgeting</button>
                <p class="hint">Click to enter budget via prompts - check console (F12)</p>
            </section>
            <section class="card result-card" id="resultCard" style="display:none;">
                <h2>Budget Summary</h2>
                <div id="results"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
